name: PR13 one-shot clang format for voxel UV changes
on:
  push:
    branches:
      - impl/v0.1.4/13-voxel-render-first
    paths:
      - .github/workflows/pr13-format-uv-once.yml
permissions:
  contents: write
jobs:
  fix-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/v0.1.4/13-voxel-render-first
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==21.1.0
      - name: Apply CI-pinned clang-format
        run: |
          clang-format --style=file -i tests/TU/Graphics/srcs/voxel/voxel_scenes_golden_test.cpp src/rendering/command/draw_voxel_bucket_command.cpp tests/TU/Graphics/srcs/voxel/voxel_renderer_test.cpp
          clang-format --style=file --dry-run --Werror tests/TU/Graphics/srcs/voxel/voxel_scenes_golden_test.cpp src/rendering/command/draw_voxel_bucket_command.cpp tests/TU/Graphics/srcs/voxel/voxel_renderer_test.cpp
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/TU/Graphics/srcs/voxel/voxel_scenes_golden_test.cpp src/rendering/command/draw_voxel_bucket_command.cpp tests/TU/Graphics/srcs/voxel/voxel_renderer_test.cpp
          if ! git diff --cached --quiet; then
            git commit -m "style(voxel): format oriented fixtures and UV test changes"
            git push origin HEAD:impl/v0.1.4/13-voxel-render-first
          fi
