name: Temporary ByteStream formatting
on:
  push:
    branches:
      - feat/engine-component-replication-memento
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install clang-format==21.1.0
      - name: Format changed C++ files
        run: |
          git diff --name-only --diff-filter=ACM origin/Version-0.1.3...HEAD -- '*.hpp' '*.cpp' |
            while IFS= read -r file; do
              clang-format -i "$file"
            done
      - name: Commit formatting and remove temporary workflow
        run: |
          git rm .github/workflows/temporary-byte-stream-format.yml
          git add -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply clang-format to ByteStream and replication changes"
          git push
