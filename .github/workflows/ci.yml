name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  GALLIUM_DRIVER: llvmpipe
  # Sparkle requests a 4.6 core context and compiles GLSL 460 shaders.
  MESA_GL_VERSION_OVERRIDE: '4.6'
  MESA_GLSL_VERSION_OVERRIDE: '460'

jobs:
  format-check:
    name: Clang-format (changed C++ files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==21.1.0
        shell: bash
      - name: Export formatted networking sources
        shell: bash
        run: |
          for path in src/network/client.cpp src/network/internal/client_session.hpp src/network/internal/client_session.cpp src/network/internal/client_reception.hpp src/network/internal/client_reception.cpp src/network/internal/client_transmission.hpp src/network/internal/client_transmission.cpp tests/TU/Core/srcs/network/client_session_integration_test.cpp; do
            echo "SPARKLE_FORMAT_BEGIN:$path"
            clang-format --style=file "$path" | base64 -w0
            echo
            echo "SPARKLE_FORMAT_END:$path"
          done
      - name: Check changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          git diff --name-only --diff-filter=ACMR -z "$base" HEAD -- '*.cpp' '*.hpp' '*.c' '*.h' '*.cc' '*.hh' |
            xargs -0 -r clang-format --style=file --dry-run --Werror

  core-unit-tests:
    name: Core unit tests (${{ matrix.os }}, ${{ matrix.configuration }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Configure Core (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build/core-test -G Ninja
          -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>'
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON
          -DVCPKG_MANIFEST_FEATURES=tests
          -DSPARKLE_BUILD_GRAPHICS=OFF
          -DSPARKLE_BUILD_TESTS=ON
          -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
      - name: Configure Core (Linux)
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build/core-test -G Ninja
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-linux
          -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON
          -DVCPKG_MANIFEST_FEATURES=tests
          -DSPARKLE_BUILD_GRAPHICS=OFF
          -DSPARKLE_BUILD_TESTS=ON
          -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
      - name: Build Core tests
        run: cmake --build build/core-test --target SparkleCoreTestSuite --parallel 4
      - name: Run functional Core tests
        run: ctest --test-dir build/core-test -R '^Core[.]' -E '^Core[.].*(StressTest|MemorySafetyTest)[.]' --output-on-failure --no-tests=error --timeout 120 --parallel 2 --output-junit results.xml
      - name: Upload Core test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-unit-tests-${{ matrix.os }}-${{ matrix.configuration }}
          path: |
            build/core-test/Testing
            build/core-test/results.xml
            build/core-test/CMakeFiles/CMakeConfigureLog.yaml

  address-sanitizer:
    name: AddressSanitizer and leak checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Locate Windows sanitizer runtime
        if: runner.os == 'Windows'
        run: |
          $resource = (clang-cl -print-resource-dir).Trim()
          $runtime = Join-Path $resource 'lib/windows'
          "LIB=$env:LIB;$runtime" >> $env:GITHUB_ENV
          $symbolizer = Join-Path (Split-Path (Get-Command clang-cl).Source) 'llvm-symbolizer.exe'
          if (Test-Path $symbolizer) { "ASAN_SYMBOLIZER_PATH=$symbolizer" >> $env:GITHUB_ENV }
      - name: Configure Windows AddressSanitizer
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build/asan -G Ninja
          -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_BUILD_TYPE=Release
          '-DCMAKE_CXX_FLAGS=/fsanitize=address /EHsc /Zi /D_DISABLE_STRING_ANNOTATION /D_DISABLE_VECTOR_ANNOTATION'
          '-DCMAKE_EXE_LINKER_FLAGS=/DEBUG:FULL /wholearchive:clang_rt.asan-x86_64.lib /wholearchive:clang_rt.asan_cxx-x86_64.lib'
          '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded'
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON
          -DVCPKG_MANIFEST_FEATURES=tests
          -DSPARKLE_BUILD_GRAPHICS=OFF
          -DSPARKLE_BUILD_TESTS=ON
          -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
      - name: Configure Linux AddressSanitizer and LeakSanitizer
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build/asan -G Ninja
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Release
          '-DCMAKE_CXX_FLAGS=-fsanitize=address -fno-omit-frame-pointer -g'
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-linux
          -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON
          -DVCPKG_MANIFEST_FEATURES=tests
          -DSPARKLE_BUILD_GRAPHICS=OFF
          -DSPARKLE_BUILD_TESTS=ON
          -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
      - name: Build sanitized Core tests
        run: cmake --build build/asan --target SparkleCoreTestSuite --parallel 4
      - name: Run memory-safety tests (Windows)
        if: runner.os == 'Windows'
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:detect_odr_violation=0:fast_unwind_on_malloc=0:windows_hook_rtl_allocators=false
        run: >-
          ctest --test-dir build/asan
          -R '^Core[.](.*MemorySafetyTest[.]|NetworkConcurrencyTest[.]ClientDestructor)'
          --output-on-failure --no-tests=error --timeout 120 --parallel 1 --output-junit results.xml
      - name: Run memory-safety and leak tests (Linux)
        if: runner.os == 'Linux'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: >-
          ctest --test-dir build/asan
          -R '^Core[.](.*MemorySafetyTest[.]|NetworkConcurrencyTest[.]ClientDestructor)'
          --output-on-failure --no-tests=error --timeout 120 --parallel 1 --output-junit results.xml
      - name: Upload sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-asan-${{ matrix.os }}
          path: |
            build/asan/Testing
            build/asan/results.xml
            build/asan/CMakeFiles/CMakeConfigureLog.yaml

  core-stress:
    name: Core stress and randomized correctness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Configure Windows stress tests
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build/stress -G Ninja
          -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_BUILD_TYPE=Release
          '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded'
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON
          -DVCPKG_MANIFEST_FEATURES=tests
          -DSPARKLE_BUILD_GRAPHICS=OFF
          -DSPARKLE_BUILD_TESTS=ON
          -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
      - name: Configure Linux stress tests
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build/stress -G Ninja
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-linux
          -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON
          -DVCPKG_MANIFEST_FEATURES=tests
          -DSPARKLE_BUILD_GRAPHICS=OFF
          -DSPARKLE_BUILD_TESTS=ON
          -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
      - name: Build Core stress tests
        run: cmake --build build/stress --target SparkleCoreTestSuite --parallel 4
      - name: Run stress suites
        run: >-
          ctest --test-dir build/stress -R '^Core[.].*StressTest[.]'
          --verbose --output-on-failure --no-tests=error --timeout 120 --parallel 1 --output-junit results.xml
      - name: Repeat concurrent networking workload
        run: >-
          ctest --test-dir build/stress
          -R '^Core[.]NetworkStressTest[.]ManyClientsConnectAndExchangeConcurrently$'
          --repeat until-fail:20 --output-on-failure --no-tests=error --timeout 120
      - name: Repeat deterministic randomized network workload
        run: >-
          ctest --test-dir build/stress -R '^Core[.]NetworkStressTest[.]SeededRandomPayloadsPreserveEveryByte$'
          --repeat until-fail:5 --output-on-failure --no-tests=error --timeout 120
      - name: Upload stress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-stress-${{ matrix.os }}
          path: |
            build/stress/Testing
            build/stress/results.xml
            build/stress/CMakeFiles/CMakeConfigureLog.yaml

  graphics-unit-tests:
    name: Graphics unit tests (${{ matrix.configuration }})
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure Graphics
        run: >-
          cmake -S . -B build/graphics-test -G Ninja
          -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>'
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DVCPKG_MANIFEST_FEATURES=tests
          -DSPARKLE_BUILD_GRAPHICS=ON
          -DSPARKLE_BUILD_TESTS=ON
          -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
      - name: Build Graphics tests
        run: cmake --build build/graphics-test --target SparkleGraphicsTestSuite --parallel 4
      - name: Install software OpenGL
        run: ./tools/ci/install-mesa.ps1 -Destination build/graphics-test/tests/TU/Graphics
      - name: Run Graphics tests
        run: ctest --test-dir build/graphics-test -R '^Graphics\.' --output-on-failure --no-tests=error --timeout 120 --parallel 1 --output-junit results.xml
      - name: Build visual comparison gallery
        if: always()
        run: >-
          python tools/ci/image-diff-report.py
          --results build/graphics-test/tests/TU/Graphics/results
          --references tests/TU/Graphics/resources/expectedImages
          --output build/visual-diffs
      - name: Upload visual comparisons
        if: always()
        id: visual-diffs
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-${{ matrix.configuration }}
          path: build/visual-diffs
          if-no-files-found: error
          retention-days: 30
      - name: Link visual comparisons in run summary
        if: always() && steps.visual-diffs.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.visual-diffs.outputs.artifact-url }}
        run: |
          "### Visual comparisons (${{ matrix.configuration }})" >> $env:GITHUB_STEP_SUMMARY
          "[Download reference / actual / difference images]($env:ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
          'Extract the ZIP and open index.html for the gallery, or inspect the PNG folders directly.' >> $env:GITHUB_STEP_SUMMARY
      - name: Upload Graphics test logs and image differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphics-unit-tests-${{ matrix.configuration }}
          path: |
            build/graphics-test/Testing
            build/graphics-test/results.xml
            build/graphics-test/tests/TU/Graphics/results
            build/graphics-test/CMakeFiles/CMakeConfigureLog.yaml

  package:
    name: Installed package (${{ matrix.configuration }})
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Verify optional component, installation and relocation
        run: ./tools/ci/test-package.ps1 -Configuration ${{ matrix.configuration }}
      - name: Upload packaging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.configuration }}
          path: |
            build/package-check/**/*.log
            build/package-check/**/results.xml
            build/package-check/**/CMakeConfigureLog.yaml
            build/package-check/**/consumer-fixture

  vcpkg-port:
    name: vcpkg port consumers
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Validate erelia-sparkle overlay port
        run: ./tools/ci/test-vcpkg-port.ps1 -Configuration Release
      - name: Upload vcpkg port evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-port
          path: |
            build/vcpkg-port-check/verification.log
            build/vcpkg-port-check/**/CMakeConfigureLog.yaml
            build/vcpkg-port-check/**/Testing


  coverage:
    name: LLVM coverage
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Set up software OpenGL and vcpkg
        run: |
          ./tools/ci/install-mesa.ps1 -Destination build/coverage/tests/TU/Graphics
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      - name: Build, test and produce coverage
        run: ./tools/coverage.ps1 -NoOpen -Triplet x64-windows-static
      - name: Upload coverage and image differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            build/coverage/reports/**/html
            build/coverage/reports/**/*.profdata
            build/coverage/reports/**/results.xml
            build/coverage/Testing
            build/coverage/tests/TU/Graphics/results
            build/coverage/CMakeFiles/CMakeConfigureLog.yaml
