name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  GALLIUM_DRIVER: llvmpipe
  # Sparkle requests a 4.6 core context and compiles GLSL 460 shaders.
  MESA_GL_VERSION_OVERRIDE: '4.6'
  MESA_GLSL_VERSION_OVERRIDE: '460'

jobs:
  format-check:
    name: Format / Changed C++ files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==21.1.0
        shell: bash
      - name: Check changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          git diff --name-only --diff-filter=ACMR -z "$base" HEAD -- '*.cpp' '*.hpp' '*.c' '*.h' '*.cc' '*.hh' |
            xargs -0 -r clang-format --style=file --dry-run --Werror

  standard-build:
    name: Build / Standard / ${{ matrix.os == 'windows-2022' && 'Windows' || 'Linux' }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Set up compilation and dependency caches
        uses: ./.github/actions/build-cache
        continue-on-error: true
        with:
          scope: standard-build
      - name: Configure Core and Graphics (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build/standard-test -G Ninja
          -DCMAKE_CXX_COMPILER=clang-cl
          '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded'
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>'
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DVCPKG_MANIFEST_FEATURES=tests
          -DSPARKLE_BUILD_GRAPHICS=ON
          -DSPARKLE_BUILD_TESTS=ON
          -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
      - name: Configure Core (Linux)
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build/standard-test -G Ninja
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-linux
          -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON
          -DVCPKG_MANIFEST_FEATURES=tests
          -DSPARKLE_BUILD_GRAPHICS=OFF
          -DSPARKLE_BUILD_TESTS=ON
          -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
      - name: Build Core and Graphics test executables (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build/standard-test --target SparkleCoreTestSuite SparkleGraphicsTestSuite --parallel 4
      - name: Build Core test executable (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build/standard-test --target SparkleCoreTestSuite --parallel 4
      - name: Install software OpenGL for test discovery
        if: runner.os == 'Windows'
        run: ./tools/ci/install-mesa.ps1 -Destination build/standard-test/tests/Graphics
      - name: Export reusable libraries and test bundles
        run: ./tools/ci/export-standard-build.ps1 -Configuration ${{ matrix.configuration }}
      - name: Report compiler cache statistics
        if: always()
        continue-on-error: true
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) { sccache --show-stats }
      - name: Upload Core test executable and registrations
        uses: actions/upload-artifact@v4
        with:
          name: standard-core-${{ matrix.os }}-${{ matrix.configuration }}
          path: build/ci-bundles/Core
          if-no-files-found: error
          retention-days: 7
      - name: Upload Graphics test executables and registrations
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: standard-graphics-${{ matrix.os }}-${{ matrix.configuration }}
          path: build/ci-bundles/Graphics
          if-no-files-found: error
          retention-days: 7
      - name: Upload compiled Sparkle libraries
        uses: actions/upload-artifact@v4
        with:
          name: standard-libraries-${{ matrix.os }}-${{ matrix.configuration }}
          path: build/ci-bundles/Libraries
          if-no-files-found: error
          retention-days: 7
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standard-build-diagnostics-${{ matrix.os }}-${{ matrix.configuration }}
          path: build/standard-test/CMakeFiles/CMakeConfigureLog.yaml

  core-unit-tests:
    name: Tests / Core fast / ${{ matrix.os == 'windows-2022' && 'Windows' || 'Linux' }} / ${{ matrix.configuration }}
    needs: standard-build
    if: always() && !cancelled()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Download compiled Core tests
        uses: actions/download-artifact@v4
        with:
          name: standard-core-${{ matrix.os }}-${{ matrix.configuration }}
          path: build/standard-test
      - name: Verify executable origin and test inventory
        run: ./tools/ci/restore-standard-build.ps1 -Suite Core -Configuration ${{ matrix.configuration }}
      - name: Run functional Core tests
        run: ctest --test-dir build/standard-test -L '^Fast$' --output-on-failure --no-tests=error --timeout 120 --parallel 2 --output-junit results.xml
      - name: Upload Core test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-unit-tests-${{ matrix.os }}-${{ matrix.configuration }}
          path: |
            build/standard-test/Testing
            build/standard-test/results.xml
            build/standard-test/build-origin.json

  address-sanitizer:
    name: Sanitizers / ${{ matrix.os == 'windows-2022' && 'ASan / Windows' || 'ASan+LSan / Linux' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Set up compilation and dependency caches
        uses: ./.github/actions/build-cache
        continue-on-error: true
        with:
          scope: ${{ github.job }}
      - name: Locate Windows sanitizer runtime
        if: runner.os == 'Windows'
        run: |
          $resource = (clang-cl -print-resource-dir).Trim()
          $runtime = Join-Path $resource 'lib/windows'
          "LIB=$env:LIB;$runtime" >> $env:GITHUB_ENV
          $symbolizer = Join-Path (Split-Path (Get-Command clang-cl).Source) 'llvm-symbolizer.exe'
          if (Test-Path $symbolizer) { "ASAN_SYMBOLIZER_PATH=$symbolizer" >> $env:GITHUB_ENV }
      - name: Configure Windows AddressSanitizer
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build/asan -G Ninja
          -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_BUILD_TYPE=Release
          '-DCMAKE_CXX_FLAGS=/fsanitize=address /EHsc /Z7 /D_DISABLE_STRING_ANNOTATION /D_DISABLE_VECTOR_ANNOTATION'
          '-DCMAKE_EXE_LINKER_FLAGS=/DEBUG:FULL /wholearchive:clang_rt.asan-x86_64.lib /wholearchive:clang_rt.asan_cxx-x86_64.lib'
          '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded'
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON
          -DVCPKG_MANIFEST_FEATURES=tests
          -DSPARKLE_BUILD_GRAPHICS=OFF
          -DSPARKLE_BUILD_TESTS=ON
          -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
      - name: Configure Linux AddressSanitizer and LeakSanitizer
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build/asan -G Ninja
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Release
          '-DCMAKE_CXX_FLAGS=-fsanitize=address -fno-omit-frame-pointer -g'
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-linux
          -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON
          -DVCPKG_MANIFEST_FEATURES=tests
          -DSPARKLE_BUILD_GRAPHICS=OFF
          -DSPARKLE_BUILD_TESTS=ON
          -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
      - name: Build sanitized Core tests
        run: cmake --build build/asan --target SparkleCoreTestSuite --parallel 4
      - name: Run memory-safety tests (Windows)
        if: runner.os == 'Windows'
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:detect_odr_violation=0:fast_unwind_on_malloc=0:windows_hook_rtl_allocators=false
        run: >-
          ctest --test-dir build/asan
          -L '^MemorySafety$'
          --output-on-failure --no-tests=error --timeout 120 --parallel 1 --output-junit results.xml
      - name: Run memory-safety and leak tests (Linux)
        if: runner.os == 'Linux'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: >-
          ctest --test-dir build/asan
          -L '^MemorySafety$'
          --output-on-failure --no-tests=error --timeout 120 --parallel 1 --output-junit results.xml
      - name: Report compiler cache statistics
        if: always()
        continue-on-error: true
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) { sccache --show-stats }
      - name: Upload sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-asan-${{ matrix.os }}
          path: |
            build/asan/Testing
            build/asan/results.xml
            build/asan/CMakeFiles/CMakeConfigureLog.yaml

  core-stress:
    name: Tests / Core stress / ${{ matrix.os == 'windows-2022' && 'Windows' || 'Linux' }} / Release
    needs: standard-build
    if: always() && !cancelled()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Download compatible Release Core tests
        uses: actions/download-artifact@v4
        with:
          name: standard-core-${{ matrix.os }}-Release
          path: build/standard-test
      - name: Verify executable origin and restore permissions
        run: ./tools/ci/restore-standard-build.ps1 -Suite Core -Configuration Release
      - name: Run stress suites
        run: >-
          ctest --test-dir build/standard-test -L '^Stress$'
          --verbose --output-on-failure --no-tests=error --timeout 120 --parallel 1 --output-junit results.xml
      - name: Repeat concurrent networking workload
        run: >-
          ctest --test-dir build/standard-test -L '^RepeatConcurrency$'
          --repeat until-fail:20 --output-on-failure --no-tests=error --timeout 120
      - name: Repeat deterministic randomized network workload
        run: >-
          ctest --test-dir build/standard-test -L '^RepeatRandomized$'
          --repeat until-fail:5 --output-on-failure --no-tests=error --timeout 120
      - name: Upload stress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-stress-${{ matrix.os }}
          path: |
            build/standard-test/Testing
            build/standard-test/results.xml
            build/standard-test/build-origin.json

  graphics-unit-tests:
    name: Tests / Graphics / Windows / ${{ matrix.configuration }}
    needs: standard-build
    if: always() && !cancelled()
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Download compiled Graphics tests
        uses: actions/download-artifact@v4
        with:
          name: standard-graphics-windows-2022-${{ matrix.configuration }}
          path: build/standard-test
      - name: Verify executable origin and test inventory
        id: restore-graphics
        run: ./tools/ci/restore-standard-build.ps1 -Suite Graphics -Configuration ${{ matrix.configuration }}
      - name: Install software OpenGL
        id: mesa
        run: ./tools/ci/install-mesa.ps1 -Destination build/standard-test/tests/Graphics
      - name: Run Release performance regressions and benchmarks
        if: always() && !cancelled() && steps.restore-graphics.outcome == 'success' && steps.mesa.outcome == 'success' && matrix.configuration == 'Release'
        id: performance
        run: >-
          ctest --test-dir build/standard-test -L '^(Performance|Benchmark)$'
          --verbose --output-on-failure --no-tests=error --timeout 120 --parallel 1 --output-junit performance-results.xml
      - name: Publish measurements from the same execution
        if: always() && !cancelled() && steps.performance.outcome != 'skipped'
        run: >-
          python tools/ci/performance-report.py
          --build build/standard-test --configuration Release
      - name: Run Graphics CPU correctness
        if: always() && !cancelled() && steps.restore-graphics.outcome == 'success' && steps.mesa.outcome == 'success'
        run: >-
          ctest --test-dir build/standard-test -L '^CPU$' -LE '^(Performance|Benchmark|Golden)$'
          --output-on-failure --no-tests=error --timeout 120 --parallel 2 --output-junit cpu-results.xml
      - name: Run Graphics functional and native tests
        if: always() && !cancelled() && steps.restore-graphics.outcome == 'success' && steps.mesa.outcome == 'success'
        run: >-
          ctest --test-dir build/standard-test -L '^Graphics$' -LE '^(CPU|Golden|Performance|Benchmark)$'
          --output-on-failure --no-tests=error --timeout 120 --parallel 1 --output-junit results.xml
      - name: Run golden-image regression tests
        if: always() && !cancelled() && steps.restore-graphics.outcome == 'success' && steps.mesa.outcome == 'success'
        run: >-
          ctest --test-dir build/standard-test -L '^Golden$'
          --output-on-failure --no-tests=error --timeout 120 --parallel 1 --output-junit golden-results.xml
      - name: Build visual comparison gallery
        if: always()
        run: >-
          python tools/ci/image-diff-report.py
          --results build/standard-test/tests/Graphics/results
          --references tests/Graphics/resources/expectedImages
          --output build/visual-diffs
      - name: Upload visual comparisons
        if: always()
        id: visual-diffs
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-${{ matrix.configuration }}
          path: build/visual-diffs
          if-no-files-found: error
          retention-days: 30
      - name: Link visual comparisons in run summary
        if: always() && steps.visual-diffs.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.visual-diffs.outputs.artifact-url }}
        run: |
          "### Visual comparisons (${{ matrix.configuration }})" >> $env:GITHUB_STEP_SUMMARY
          "[Download reference / actual / difference images]($env:ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
          'Extract the ZIP and open index.html for the gallery, or inspect the PNG folders directly.' >> $env:GITHUB_STEP_SUMMARY
      - name: Upload Graphics test logs and image differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphics-unit-tests-${{ matrix.configuration }}
          path: |
            build/standard-test/Testing
            build/standard-test/*results.xml
            build/standard-test/performance-report.md
            build/standard-test/performance.log
            build/standard-test/tests/Graphics/results
            build/standard-test/build-origin.json

  package:
    name: Package / Installed / ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Set up compilation and dependency caches
        uses: ./.github/actions/build-cache
        continue-on-error: true
        with:
          scope: ${{ github.job }}
      - name: Verify optional component, installation and relocation
        run: ./tools/ci/test-package.ps1 -Configuration ${{ matrix.configuration }}
      - name: Report compiler cache statistics
        if: always()
        continue-on-error: true
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) { sccache --show-stats }
      - name: Upload packaging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.configuration }}
          path: |
            build/package-check/**/*.log
            build/package-check/**/results.xml
            build/package-check/**/CMakeConfigureLog.yaml
            build/package-check/**/consumer-fixture

  vcpkg-port:
    name: Package / vcpkg consumers
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Set up compilation and dependency caches
        uses: ./.github/actions/build-cache
        continue-on-error: true
        with:
          scope: ${{ github.job }}
      - name: Validate erelia-sparkle overlay port
        run: ./tools/ci/test-vcpkg-port.ps1 -Configuration Release
      - name: Report compiler cache statistics
        if: always()
        continue-on-error: true
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) { sccache --show-stats }
      - name: Upload vcpkg port evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-port
          path: |
            build/vcpkg-port-check/verification.log
            build/vcpkg-port-check/**/CMakeConfigureLog.yaml
            build/vcpkg-port-check/**/Testing


  compiler-compatibility:
    name: Compiler / ${{ matrix.compiler == 'cl' && 'MSVC' || 'GCC' }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
        configuration: [Debug, Release]
        include:
          - os: windows-2022
            compiler: cl
          - os: ubuntu-24.04
            compiler: g++
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Set up compilation and dependency caches
        uses: ./.github/actions/build-cache
        continue-on-error: true
        with:
          scope: ${{ github.job }}
      - name: Configure with MSVC
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build/compiler-compat -G Ninja
          -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded'
          '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>'
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DVCPKG_MANIFEST_FEATURES=tests
          -DSPARKLE_BUILD_GRAPHICS=ON
          -DSPARKLE_BUILD_TESTS=ON
          -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
      - name: Configure with GCC
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build/compiler-compat -G Ninja
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-linux
          -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON
          -DVCPKG_MANIFEST_FEATURES=tests
          -DSPARKLE_BUILD_GRAPHICS=OFF
          -DSPARKLE_BUILD_TESTS=ON
          -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
      - name: Compile Core and Graphics suites with MSVC
        if: runner.os == 'Windows'
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          cmake --build build/compiler-compat --target SparkleCoreTestSuite SparkleGraphicsTestSuite --parallel 4
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0 -and $env:CMAKE_CXX_COMPILER_LAUNCHER)
          {
            # The GitHub Actions sccache backend can return HTTP 503 / ServerBusy.
            # Retry without its launcher; genuine compiler errors still fail.
            Write-Warning 'MSVC build failed; retrying without sccache'
            cmake -S . -B build/compiler-compat '-DCMAKE_CXX_COMPILER_LAUNCHER='
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cmake --build build/compiler-compat --target SparkleCoreTestSuite SparkleGraphicsTestSuite --parallel 4
            $buildExitCode = $LASTEXITCODE
          }
          $timer.Stop()
          $seconds = [math]::Round($timer.Elapsed.TotalSeconds, 1)
          "MSVC ${{ matrix.configuration }} compile: $seconds seconds" >> $env:GITHUB_STEP_SUMMARY
          if ($buildExitCode -ne 0) { exit $buildExitCode }
      - name: Compile Core suite with GCC
        if: runner.os == 'Linux'
        run: cmake --build build/compiler-compat --target SparkleCoreTestSuite --parallel 4
      - name: Report compiler cache statistics
        if: always()
        continue-on-error: true
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) { sccache --show-stats }


  coverage:
    name: Coverage / LLVM
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Set up compilation and dependency caches
        uses: ./.github/actions/build-cache
        continue-on-error: true
        with:
          scope: ${{ github.job }}
      - name: Set up software OpenGL and vcpkg
        run: |
          ./tools/ci/install-mesa.ps1 -Destination build/coverage/tests/Graphics
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      - name: Build, test and produce coverage
        run: ./tools/coverage.ps1 -NoOpen -Triplet x64-windows-static
      - name: Report compiler cache statistics
        if: always()
        continue-on-error: true
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) { sccache --show-stats }
      - name: Upload coverage and image differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            build/coverage/reports/**/html
            build/coverage/reports/**/*.profdata
            build/coverage/reports/**/results*.xml
            build/coverage/Testing
            build/coverage/tests/Graphics/results
            build/coverage/CMakeFiles/CMakeConfigureLog.yaml
