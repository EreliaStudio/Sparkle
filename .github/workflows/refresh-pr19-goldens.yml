name: Refresh PR19 goldens (temporary)

on:
  push:
    branches:
      - impl/v0.1.4/19-forward-lighting

permissions:
  contents: write
  actions: write

jobs:
  refresh-pr19-goldens:
    if: contains(github.event.head_commit.message, 'stage PR19 golden refresh')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR19 branch
        uses: actions/checkout@v4
        with:
          ref: impl/v0.1.4/19-forward-lighting
          persist-credentials: true
      - name: Download CI captures from scaled-sword run
        uses: actions/download-artifact@v4
        with:
          run-id: 44066873617
          name: visual-diffs-Debug
          github-token: ${{ github.token }}
          path: _pr19_golden_capture
      - name: Refresh only the 22 failed articulated goldens
        shell: bash
        run: |
          set -euo pipefail
          source_dir="_pr19_golden_capture/actual/rendering/forward-lighting"
          target_dir="tests/TU/Graphics/resources/expectedImages/rendering/forward-lighting"
          test -d "$source_dir"
          mapfile -d '' images < <(find "$source_dir" -maxdepth 1 -type f -name '*.png' -print0)
          test "${#images[@]}" -eq 22
          for file in "${images[@]}"; do
            test -f "$target_dir/$(basename "$file")"
            cp "$file" "$target_dir/$(basename "$file")"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$target_dir"
          git diff --cached --stat
          test "$(git diff --cached --name-only -- "$target_dir" | wc -l)" -eq 22
          git commit -m "test(graphics): refresh 22 articulated lighting goldens after sword fix"
          git push origin HEAD:impl/v0.1.4/19-forward-lighting
      - name: Dispatch CI on refreshed references
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run ci.yml --ref impl/v0.1.4/19-forward-lighting
