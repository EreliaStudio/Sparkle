name: PR27 Volume formatting (temporary)
on:
  push:
    branches: [feature/v0.1.4-pr27-voxel-networking]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==21.1.0
      - name: Format PR27 changed C++ files
        run: |
          clang-format -i include/voxel/volume.hpp src/voxel/volume.cpp tests/TU/Core/srcs/voxel/voxel_volume_stream_test.cpp
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add include/voxel/volume.hpp src/voxel/volume.cpp tests/TU/Core/srcs/voxel/voxel_volume_stream_test.cpp
            git commit -m 'style: clang-format Volume serialization changes'
            git push origin HEAD:feature/v0.1.4-pr27-voxel-networking
          fi
