name: PR13 one-time reviewed UV golden images
on:
  push:
    branches:
      - impl/v0.1.4/13-voxel-render-first
    paths:
      - .github/workflows/pr13-refresh-uv-goldens-once.yml
permissions:
  contents: write
  actions: read
jobs:
  publish-reviewed-goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/v0.1.4/13-voxel-render-first
          persist-credentials: true
      - name: Download pixel-identical Debug captures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42873296919 --repo EreliaStudio/Sparkle -n graphics-unit-tests-Debug -D captured
      - name: Replace 54 voxel golden references
        shell: bash
        run: |
          set -euo pipefail
          sourceRoot="captured/tests/TU/Graphics/results/rendering"
          expectedRoot="tests/TU/Graphics/resources/expectedImages/rendering"
          test "$(find "$sourceRoot/voxel-scenes" -maxdepth 1 -name '*.png' ! -name '*_difference.png' | wc -l)" -eq 49
          mkdir -p "$expectedRoot/voxel-scenes" "$expectedRoot/voxel"
          for capture in "$sourceRoot/voxel-scenes/"*.png; do
            [[ "$capture" == *_difference.png ]] && continue
            cp "$capture" "$expectedRoot/voxel-scenes/"
          done
          goldenVoxel=(cube_rotated cube_textured shared_mesh_instanced two_palettes voxel_room_widget)
          for name in "${goldenVoxel[@]}"; do
            test -s "$sourceRoot/voxel/$name.png"
            cp "$sourceRoot/voxel/$name.png" "$expectedRoot/voxel/$name.png"
          done
          rm -f "$expectedRoot/voxel-scenes/room_shared_meshes.png"
          test "$(find "$expectedRoot/voxel-scenes" -maxdepth 1 -name '*.png' | wc -l)" -eq 49
      - name: Commit reviewed references
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tests/TU/Graphics/resources/expectedImages/rendering/voxel/ tests/TU/Graphics/resources/expectedImages/rendering/voxel-scenes/
          git commit -m "test(voxel): approve 54 UV-mapped and correctly oriented golden captures"
          git push origin HEAD:impl/v0.1.4/13-voxel-render-first
