name: Format PR 43 sources

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/v0.1.4/03-occlusion-cache
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==21.1.0
      - name: Apply repository formatting
        shell: bash
        run: |
          git diff --name-only -z origin/V0.1.4...HEAD -- '*.cpp' '*.hpp' '*.c' '*.h' '*.cc' '*.hh' | xargs -0 -r clang-format -i --style=file
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.cpp' '*.hpp' '*.c' '*.h' '*.cc' '*.hh'
          if ! git diff --cached --quiet; then
            git commit -m 'style(voxel): apply clang-format 21.1.0 to PR 43'
            git push origin HEAD:impl/v0.1.4/03-occlusion-cache
          fi
