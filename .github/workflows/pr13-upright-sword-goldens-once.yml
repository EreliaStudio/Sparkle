name: PR13 once - vertical sword and hand-axis goldens
on:
  push:
    branches:
      - impl/v0.1.4/13-voxel-render-first
    paths:
      - .github/workflows/pr13-upright-sword-goldens-once.yml
permissions:
  contents: write
  actions: read
jobs:
  import-goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/v0.1.4/13-voxel-render-first
          persist-credentials: true
      - name: Download real OpenGL debug captures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43003649041 --repo EreliaStudio/Sparkle -n graphics-unit-tests-Debug -D captures
      - name: Verify reviewed captures and update golden images
        shell: bash
        run: |
          set -euo pipefail
          source_dir=captures/tests/TU/Graphics/results/rendering/voxel-scenes
          target_dir=tests/TU/Graphics/resources/expectedImages/rendering/voxel-scenes
          echo "fe4ca4aa74d1d295bd0e7e90eaef7f7df8c0735ae9561b89fa8c7e5aa53280c5  $source_dir/character_with_sword.png" | sha256sum -c -
          echo "12346d263838d2e0213e2f352dd42f747b2f91657ca83575e4b9620cc5ece96f  $source_dir/room_inside_character.png" | sha256sum -c -
          cp "$source_dir/character_with_sword.png" "$target_dir/character_with_sword.png"
          cp "$source_dir/room_inside_character.png" "$target_dir/room_inside_character.png"
      - name: Commit the two pixel-identical Debug and Release references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/TU/Graphics/resources/expectedImages/rendering/voxel-scenes/character_with_sword.png
          git add tests/TU/Graphics/resources/expectedImages/rendering/voxel-scenes/room_inside_character.png
          git diff --cached --quiet && { echo "No golden changes" >&2; exit 1; } || test $? -eq 1
          git commit -m "test(voxel): approve upright local sword with rotated hand attachment"
          git push origin HEAD:impl/v0.1.4/13-voxel-render-first
