name: Import approved PR 105 goldens
on:
  push:
    branches:
      - perf/v0.1.5-shadow-rendering
    paths:
      - .github/workflows/import-approved-pr105-goldens.yml
  pull_request:
    types: [synchronize]
    branches: [V0.1.5]
    paths:
      - .github/workflows/import-approved-pr105-goldens.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: import-approved-pr105-goldens
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'EreliaStudio/Sparkle' && (github.ref == 'refs/heads/perf/v0.1.5-shadow-rendering' || (github.event.pull_request.number == 105 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'perf/v0.1.5-shadow-rendering'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/v0.1.5-shadow-rendering
          fetch-depth: 2
      - name: Verify exact approved source
        run: |
          test "$(git rev-parse HEAD^)" = a6f4bc5c3beb94c8b980d177bc628a74bb8865d6
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/import-approved-pr105-goldens.yml
      - uses: actions/download-artifact@v4
        with:
          name: visual-diffs-Release
          run-id: 46003219581
          github-token: ${{ github.token }}
          path: /tmp/pr105-goldens
      - name: Verify and replace only the thirteen approved PNGs
        shell: bash
        run: |
          set -euo pipefail
          dir=tests/TU/Graphics/resources/expectedImages/rendering/biome-world
          while read -r name old new; do
            src="/tmp/pr105-goldens/actual/rendering/biome-world/$name.png"
            dst="$dir/$name.png"
            test "$(git hash-object "$dst")" = "$old"
            test "$(git hash-object "$src")" = "$new"
            cp -- "$src" "$dst"
            git add -- "$dst"
          done <<'HASHES'
          biome_checkerboard 1ee62728891adc4917fa234b3dd919eabd9b91ba 20a501230edd906e865dc7f33a4a41bd664b1cca
          biome_negative_chunk_seams 5b95a68892b9de23edfbb373e214febbd6b10780 08c8625c4d9726d4b68b5da71d3190f61e02904a
          biome_perlin_islands 1c6db1377b29c39506dd9cf4bce34498cc49aa71 2144c8b34e0fc03a83208f83466e4cb4cc079f50
          biome_three_way_blend c0bcb1bb41b982dbd9ce69c79c9c33f7d070fb5b 10cf9da9f38292f17c29b110fa1880691a042006
          grid_scale_four 054f9eb89da88555c8ad4a90caafefecc568e0fd cb234921277b04b76c3e979c170f300e3c446309
          grid_scale_half b96ecb7630f7f66af062d1b2cc647282a5010dd7 3bae25dcd4b2992e792c062e2e4e09e79ac4cb23
          grid_scale_two d1c416588ec5f5005cadb92baa02f31fb9fd21ac 8cf9466c94f2c21485e7a946e7b468a503db63a1
          height_multilayer_perlin 7dd5ea14dc3b445a3b078bb5fc73a805187d1971 a97b456dc0c4bd07f57155a04ab06aa244115e9e
          height_negative_elevation eb321e4d462e4a243d600522e2c8f8e269794e2a 53b76592a7a59009e7a876fea52edf8eb6c0e4ba
          height_vertical_stack 6d41897bed198d44d84218aa542d8d8d5b51b2a7 cb157711bb022e57ca6634593f85db12af3f1b74
          strata_independent_perlin 04fb8ce5442fc6d1079bac1f6d0cf7fd42b7b2d5 cdfdb6f8d922e1b9cbf78d91eb1b9692d4a99971
          strata_two_perlin_layers 58ee37df354fe7499d6a7555fa17116eb6fb3442 1f0ac618791272e4df3b4bc32c4c7aedc31583a7
          top_down d49adb82ecbc8c41866e999ce3b2bfa23b57eb59 95cebdc0ef1e4dbd51c5177ca80e14eb7a1115a7
          HASHES
          test "$(git diff --cached --name-only | wc -l)" -eq 13
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: refresh thirteen approved greedy shadow golden images'
          git push origin HEAD:refs/heads/perf/v0.1.5-shadow-rendering
