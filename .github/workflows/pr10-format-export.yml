name: PR10 temporary formatting export

on:
  pull_request:
    branches: [V0.1.4]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==21.1.0
      - name: Format and export changed source files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only -z "$BASE_SHA" HEAD -- '*.cpp' '*.hpp' '*.c' '*.h' '*.cc' '*.hh' |
            xargs -0 -r clang-format -i --style=file
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          base = "${{ github.event.pull_request.base.sha }}"
          paths = subprocess.check_output(["git", "diff", "--name-only", base, "HEAD", "--", "*.cpp", "*.hpp", "*.c", "*.h", "*.cc", "*.hh"]).decode().splitlines()
          for path in paths:
              content = Path(path).read_text(encoding="utf-8")
              print("PR10FILE:" + json.dumps({"path": path, "content": content}, ensure_ascii=True, separators=(",", ":")))
          PY
