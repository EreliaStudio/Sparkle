name: Format PR102 changed C++ files (one-off)
on:
  push:
    branches:
      - maintenance/pr102-golden-pcf1024
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d2339b3404e9786bd8b7d3c0a882975e10e4808d
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact CI formatter
        run: |
          python -m pip install clang-format==21.1.0
          clang-format --version
          clang-format -i include/geometry/shadow_mesh.hpp include/shadow_map/projection.hpp src/graphics/shadow_map/projection.cpp src/rendering/engine/lighting_system.cpp src/rendering/engine/shadow_map_rendering_system.cpp tests/TU/Graphics/srcs/shadow_map/projection_test.cpp tests/TU/Graphics/srcs/shadow_map/rendering_golden_test.cpp tests/TU/Graphics/srcs/voxel/biome_world_validation_test.cpp
          clang-format --dry-run --Werror include/geometry/shadow_mesh.hpp include/shadow_map/projection.hpp src/graphics/shadow_map/projection.cpp src/rendering/engine/lighting_system.cpp src/rendering/engine/shadow_map_rendering_system.cpp tests/TU/Graphics/srcs/shadow_map/projection_test.cpp tests/TU/Graphics/srcs/shadow_map/rendering_golden_test.cpp tests/TU/Graphics/srcs/voxel/biome_world_validation_test.cpp
          git diff --stat
          git diff --check
      - name: Commit formatting only
        run: |
          test "$(git rev-parse HEAD)" = "d2339b3404e9786bd8b7d3c0a882975e10e4808d"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- include/geometry/shadow_mesh.hpp include/shadow_map/projection.hpp src/graphics/shadow_map/projection.cpp src/rendering/engine/lighting_system.cpp src/rendering/engine/shadow_map_rendering_system.cpp tests/TU/Graphics/srcs/shadow_map/projection_test.cpp tests/TU/Graphics/srcs/shadow_map/rendering_golden_test.cpp tests/TU/Graphics/srcs/voxel/biome_world_validation_test.cpp
          git diff --cached --quiet && exit 0
          git commit -m "Apply clang-format to shadow rendering changes"
          git push origin HEAD:refs/heads/fix/v0.1.5-voxel-world-shadows
