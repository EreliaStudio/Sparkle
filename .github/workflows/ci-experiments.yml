name: CI experiments
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
permissions:
  contents: read
defaults:
  run:
    shell: pwsh
env:
  GALLIUM_DRIVER: llvmpipe
  MESA_GL_VERSION_OVERRIDE: '4.6'
  MESA_GLSL_VERSION_OVERRIDE: '460'
jobs:
  experiment:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ci-experiments'
    name: Windows Release experiment (${{ matrix.mode }})
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, pch, unity, parallel]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Restore dependencies
        uses: ./.github/actions/build-cache
        continue-on-error: true
        with:
          scope: experiments
      - name: Configure without compiler caching
        run: >-
          cmake -S . -B build/experiment -G Ninja
          -DCMAKE_CXX_COMPILER=clang-cl
          '-DCMAKE_CXX_COMPILER_LAUNCHER='
          -DCMAKE_BUILD_TYPE=Release
          '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded'
          '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded'
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DVCPKG_MANIFEST_FEATURES=tests
          -DSPARKLE_BUILD_GRAPHICS=ON
          -DSPARKLE_BUILD_TESTS=ON
          -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
          -DSPARKLE_EXPERIMENTAL_PCH=${{ matrix.mode == 'pch' && 'ON' || 'OFF' }}
          -DSPARKLE_EXPERIMENTAL_UNITY=${{ matrix.mode == 'unity' && 'ON' || 'OFF' }}
          -DSPARKLE_EXPERIMENTAL_PARALLEL_GRAPHICS=${{ matrix.mode == 'parallel' && 'ON' || 'OFF' }}
      - name: Measure clean build
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          cmake --build build/experiment --target SparkleCoreTestSuite SparkleGraphicsTestSuite --parallel 4
          $code = $LASTEXITCODE
          $timer.Stop()
          "Build: $($timer.Elapsed.TotalSeconds) seconds (exit $code)" >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { exit $code }
      - name: Install software OpenGL
        id: mesa
        run: ./tools/ci/install-mesa.ps1 -Destination build/experiment/tests/Graphics
      - name: Run isolated performance
        run: ctest --test-dir build/experiment -L '^(Performance|Benchmark)$' --parallel 1 --output-on-failure --no-tests=error --timeout 120 --output-junit results-performance.xml
      - name: Run Core tests
        if: always() && !cancelled() && steps.mesa.outcome == 'success'
        run: ctest --test-dir build/experiment -L '^Core$' --parallel 1 --output-on-failure --no-tests=error --timeout 120 --output-junit results-core.xml
      - name: Run audited concurrent Graphics candidates
        if: always() && !cancelled() && steps.mesa.outcome == 'success' && matrix.mode == 'parallel'
        run: ctest --test-dir build/experiment -L '^ExperimentalParallel$' --parallel 2 --output-on-failure --no-tests=error --timeout 120 --output-junit results-parallel.xml
      - name: Run Graphics correctness
        if: always() && !cancelled() && steps.mesa.outcome == 'success'
        run: ctest --test-dir build/experiment -L '^Graphics$' -LE '^(Golden|Performance|Benchmark|ExperimentalParallel)$' --parallel 1 --output-on-failure --no-tests=error --timeout 120 --output-junit results-graphics.xml
      - name: Run Golden images
        if: always() && !cancelled() && steps.mesa.outcome == 'success'
        run: ctest --test-dir build/experiment -L '^Golden$' -LE '^ExperimentalParallel$' --parallel 1 --output-on-failure --no-tests=error --timeout 120 --output-junit results-golden.xml
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-${{ matrix.mode }}
          path: |
            build/experiment/*results*.xml
            build/experiment/Testing
            build/experiment/tests/Graphics/results
            build/experiment/CMakeFiles/CMakeConfigureLog.yaml
