name: PR13 one-time approved camera and character goldens
on:
  push:
    branches:
      - impl/v0.1.4/13-voxel-render-first
    paths:
      - .github/workflows/pr13-refresh-camera-goldens-once.yml
permissions:
  actions: read
  contents: write
jobs:
  approve-validated-captures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download pixel-matched Windows Debug captures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42846199646 --repo EreliaStudio/Sparkle -n graphics-unit-tests-Debug -D captured
      - name: Copy ten visually checked voxel references
        shell: bash
        run: |
          set -euo pipefail
          src="captured/tests/TU/Graphics/results/rendering/voxel-scenes"
          dst="tests/TU/Graphics/resources/expectedImages/rendering/voxel-scenes"
          mkdir -p "$dst"
          files=(
            character_neutral.png
            character_left_arm_raised.png
            character_both_arms_raised.png
            character_walking.png
            character_with_sword.png
            room_camera_inside_wall.png
            room_camera_inside_floor.png
            room_camera_floor_grazing.png
            room_inside_character.png
            room_exterior_characters.png
          )
          for file in "${files[@]}"; do
            test -s "$src/$file"
            cp "$src/$file" "$dst/$file"
          done
          test "${#files[@]}" -eq 10
      - name: Commit updated golden PNGs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/TU/Graphics/resources/expectedImages/rendering/voxel-scenes/
          git commit -m "test(voxel): approve ten scaled-character and embedded-camera goldens"
          git push origin HEAD:impl/v0.1.4/13-voxel-render-first
