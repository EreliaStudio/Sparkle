name: PR13 approve reviewed voxel captures
on:
  push:
    branches:
      - impl/v0.1.4/13-voxel-render-first
    paths:
      - .github/workflows/pr13-approve-goldens.yml
permissions:
  actions: read
  contents: write
jobs:
  approve-captures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download generated Debug goldens from CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42838510553 --repo EreliaStudio/Sparkle -n graphics-unit-tests-Debug -D captured
      - name: Check and install reviewed references
        shell: bash
        run: |
          set -euo pipefail
          sourceRoot="captured/tests/TU/Graphics/results/rendering"
          targetRoot="tests/TU/Graphics/resources/expectedImages/rendering"
          test "$(find "$sourceRoot/voxel" -name '*.png' | wc -l)" -eq 5
          test "$(find "$sourceRoot/voxel-scenes" -name '*.png' | wc -l)" -eq 46
          mkdir -p "$targetRoot/voxel" "$targetRoot/voxel-scenes"
          cp "$sourceRoot/voxel/"*.png "$targetRoot/voxel/"
          cp "$sourceRoot/voxel-scenes/"*.png "$targetRoot/voxel-scenes/"
      - name: Commit approved references
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/TU/Graphics/resources/expectedImages/rendering/voxel/
          git add tests/TU/Graphics/resources/expectedImages/rendering/voxel-scenes/
          git commit -m "test(voxel): approve 51 real OpenGL golden reference images"
          git push origin HEAD:impl/v0.1.4/13-voxel-render-first
