name: PR27 auto-format (temporary)

on:
  push:
    branches:
      - feature/v0.1.4-pr27-voxel-networking

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Format PR27 C++ files
        run: |
          clang-format --version
          clang-format -i \
            include/voxel/world.hpp \
            include/voxel/network.hpp \
            src/voxel/world.cpp \
            src/voxel/network.cpp \
            tests/TU/Core/srcs/voxel/voxel_network_test.cpp
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add include/voxel/world.hpp include/voxel/network.hpp src/voxel/world.cpp src/voxel/network.cpp tests/TU/Core/srcs/voxel/voxel_network_test.cpp
            git commit -m 'style: apply clang-format to PR27'
            git push origin HEAD:feature/v0.1.4-pr27-voxel-networking
          fi
