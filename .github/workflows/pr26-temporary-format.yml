name: PR26 temporary clang-format apply
on:
  push:
    branches: [impl/v0.1.4/26-model3d-animator]

permissions:
  contents: write

jobs:
  autoformat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/v0.1.4/26-model3d-animator
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==21.1.0
      - name: Format PR26 C++ and push
        shell: bash
        run: |
          set -eu
          base="$(git merge-base origin/V0.1.4 HEAD)"
          git diff --name-only --diff-filter=ACMR -z "$base" HEAD -- '*.cpp' '*.hpp' '*.h' '*.cc' |
            xargs -0 -r clang-format --style=file -i
          if git diff --quiet; then
            echo 'Already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'chore: apply clang-format to PR26 sources'
          git push origin HEAD:impl/v0.1.4/26-model3d-animator
