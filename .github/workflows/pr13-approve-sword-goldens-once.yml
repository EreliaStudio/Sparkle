name: PR13 one-time reviewed sword golden captures
on:
  push:
    branches:
      - impl/v0.1.4/13-voxel-render-first
    paths:
      - .github/workflows/pr13-approve-sword-goldens-once.yml
permissions:
  actions: read
  contents: write
jobs:
  approve-reviewed-character-captures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/v0.1.4/13-voxel-render-first
          persist-credentials: true
      - name: Download Windows Debug golden captures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42881470861 --repo EreliaStudio/Sparkle -n graphics-unit-tests-Debug -D captured
      - name: Copy only the six visually reviewed references
        shell: bash
        run: |
          set -euo pipefail
          source="captured/tests/TU/Graphics/results/rendering/voxel-scenes"
          target="tests/TU/Graphics/resources/expectedImages/rendering/voxel-scenes"
          files=(
            character_neutral.png
            character_left_arm_raised.png
            character_walking.png
            character_with_sword.png
            room_exterior_characters.png
            room_inside_character.png
          )
          test "${#files[@]}" -eq 6
          test "$(find "$source" -maxdepth 1 -name '*.png' ! -name '*_difference.png' | wc -l)" -eq 6
          for name in "${files[@]}"; do
            test -s "$source/$name"
            cp "$source/$name" "$target/$name"
          done
      - name: Commit revised golden references
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/TU/Graphics/resources/expectedImages/rendering/voxel-scenes
          git commit -m "test(voxel): approve sword grip and lowered sleeve goldens"
          git push origin HEAD:impl/v0.1.4/13-voxel-render-first
